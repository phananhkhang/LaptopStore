<!doctype html><meta charset="utf-8"><style>body{font:13px/1.5 Inter,Arial,sans-serif;margin:24px;color:#212226}h1{font-size:22px}button{background:#e65319;color:white;border:0;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%}.muted{color:#74777f}#status{margin:20px 0;padding:16px;background:#fff1e8;border-radius:10px}img{max-width:100%;border:1px solid #e9eaed;border-radius:8px}pre{white-space:pre-wrap;font-size:11px}progress{width:100%;accent-color:#e65319}</style><h1>LaptopStore / Full website</h1><p class="muted">53 màn hình cho Khách hàng, Staff và Admin. Assets vector nguyên bản, components và prototype có thể chỉnh sửa.</p><p>Tạo một page mới trong file hiện tại. Các page hiện có được giữ lại. Plugin hoạt động cục bộ, không gọi mạng.</p><button id="build">Dựng toàn bộ giao diện & prototype</button><div id="status">Sẵn sàng. Thời gian phụ thuộc hiệu năng Figma.</div><progress id="progress" max="7" value="0"></progress><div id="previews"></div><script>document.getElementById('build').onclick=()=>{parent.postMessage({pluginMessage:{type:'build'}},'*');document.getElementById('build').disabled=true};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='progress'){document.getElementById('progress').value=m.step;document.getElementById('status').textContent=m.step+'/'+m.total+' · '+m.label;}if(m.type==='done'){document.getElementById('status').textContent='Đã dựng '+m.report.screens+' màn / '+m.report.connections+' liên kết prototype.';const p=document.createElement('pre');p.textContent=JSON.stringify(m.report,null,2);document.getElementById('previews').appendChild(p);}if(m.type==='error'){document.getElementById('status').textContent=m.message;document.getElementById('build').disabled=false;}if(m.type==='preview'){const h=document.createElement('h3');h.textContent=m.key;const i=document.createElement('img');i.src=URL.createObjectURL(new Blob([m.bytes],{type:'image/png'}));document.getElementById('previews').append(h,i);}};</script>
