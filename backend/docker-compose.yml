services:

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/${DB_NAME:-laptop_store}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-network


  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${DB_NAME:-laptop_store}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    ports:
      - "${DB_HOST_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - app-network


volumes:
  postgres-data:


networks:
  app-network:
    driver: bridge