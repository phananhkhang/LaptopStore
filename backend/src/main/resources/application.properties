spring.application.name=LaptopStore

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:laptop_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA & HIBERNATE CONFIGURATION
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# SECURITY & JWT CONFIGURATION
# ==============================================================================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0e9f1a7b3c5d8e2f4a6b0c1d3e5f7a9b2c4d6e8f0a}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:604800000}
app.jwt.refresh-cookie-name=refresh_token

# ==============================================================================
# AI CONFIGURATION BASE
# ==============================================================================
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:mock-key}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

# ==============================================================================
# VNPAY CONFIGURATION BASE
# ==============================================================================
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMO_HASH_SECRET_KEY_FOR_SANDBOX}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8081/api/v1/payments/vnpay/ipn}

spring.config.import=optional:file:.env[.properties]

server.port=8081